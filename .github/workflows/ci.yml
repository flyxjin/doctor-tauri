name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'tauri_app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'tauri_app/**'
      - '.github/workflows/ci.yml'

defaults:
  run:
    working-directory: tauri_app

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri_app

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tauri_app/package-lock.json

      - name: 安装 Rust stable-msvc
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri_app/src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: ESLint 代码规范检查
        run: npx eslint src

      - name: 前端单元测试（Vitest）
        run: npx vitest run

      - name: Rust 代码格式检查
        working-directory: tauri_app/src-tauri
        run: cargo fmt --all -- --check

      - name: Rust Clippy 检查
        working-directory: tauri_app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust 单元测试
        working-directory: tauri_app/src-tauri
        run: cargo test --lib
