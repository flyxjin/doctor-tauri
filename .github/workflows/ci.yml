name: CI

on:
  # 手动触发：Actions 页 Run workflow，用于启用/改配置后验证流水线
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - '.github/workflows/ci.yml'

# 同分支新提交取代旧运行时取消进行中的 CI，节省构建资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 安装 Rust stable-msvc
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: ESLint 代码规范检查
        run: npm run lint

      - name: 前端单元测试（Vitest）
        run: npm test

      - name: Rust 代码格式检查
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust Clippy 检查
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust 单元测试
        working-directory: src-tauri
        run: cargo test --lib
