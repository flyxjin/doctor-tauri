# -*- coding: utf-8 -*-
# mypy 配置文件
# 分阶段收紧类型检查：当前为基础模式，后续逐步切换到 strict

[mypy]
python_version = 3.12
# 忽略第三方库缺失的类型存根
ignore_missing_imports = True
# 暂不强制 strict-optional（Optional[int] 可接受 None 赋值给 int）
no_strict_optional = True
# 检查未注解函数体
check_untyped_defs = True
# 允许隐式 Any（逐步收紧）
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = False
show_error_codes = True
show_column_numbers = True
pretty = True

# 排除测试文件（测试中使用较多动态特性）
[mypy-tests.*]
ignore_errors = True

# 排除 core/tests.py（unittest 基类，动态属性多）
[mypy-core.tests]
ignore_errors = True

# 排除视图层（PySide6 信号/槽类型检查复杂度高）
[mypy-views.*]
ignore_errors = True

# 排除迁移脚本（动态 SQL 构建）
[mypy-core.migrations]
ignore_errors = True

# 排除更新器（PySide6 QThread 类型注解复杂）
[mypy-utils.updater]
ignore_errors = True
